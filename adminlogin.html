<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login - Global Awareness Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            background-attachment: fixed;
            color: #1a2e35;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .login-box {
            background: rgba(255 255 255 / 0.85);
            backdrop-filter: blur(24px);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(16 185 129 / 0.3);
            max-width: 420px;
            width: 100%;
            padding: 3rem 2.5rem;
            box-sizing: border-box;
            animation: floatIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.97);
        }

        @keyframes floatIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            text-align: center;
            font-weight: 700;
            color: #15803d;
            font-size: 2rem;
            margin-bottom: 2rem;
            user-select: none;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            border-radius: 0.75rem;
            border: 2px solid #a7f3d0;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            user-select: text;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 10px #059669aa;
        }

        button#loginBtn {
            width: 100%;
            padding: 1rem;
            background-color: #16a34a;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
            user-select: none;
        }

        button#loginBtn:hover:not(:disabled) {
            background-color: #15803d;
        }

        button#loginBtn:disabled {
            background-color: #a7f3d0;
            cursor: not-allowed;
        }

        #errorMsg {
            color: #dc2626;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
            user-select: none;
        }

        #lockMsg {
            color: #dc2626;
            font-weight: 600;
            text-align: center;
            margin-top: 1rem;
            display: none;
            user-select: none;
        }
    </style>
</head>

<body>

    <main class="login-box" role="main" aria-label="Admin Login form">
        <h2>Admin Login</h2>

        <div id="errorMsg" role="alert" aria-live="assertive"></div>

        <form id="loginForm" novalidate autocomplete="off">
            <input id="adminEmail" type="email" placeholder="Enter admin email" autocomplete="off" autocorrect="off" autocapitalize="none"
                spellcheck="false" aria-required="true" aria-label="Admin email" required />
            <input id="adminPassword" type="password" placeholder="Enter admin password" autocomplete="new-password" autocorrect="off"
                autocapitalize="none" spellcheck="false" aria-required="true" aria-label="Admin password" required />
            <button id="loginBtn" type="submit">Login</button>
        </form>

        <p id="lockMsg" role="alert" aria-live="assertive"></p>
    </main>

    <script>
        const LOCK_TIME = 5 * 60 * 1000; // 5 minutes lockout

        const defaultAdmins = [
            { email: "24ug1bycs888@bmsit.in", password: "Yogendra@#$123" },
            { email: "jaulhaq369@gmail.com", password: "itsmejaulhaq09098" },
            { email: "24ug1bycs901@bmsit.in", password: "mrkhatarnak" },
            { email: "official.aashish234@gmail.com", password: "9807768677@123" }
        ];

        window.onload = function () {
            const emailInput = document.getElementById("adminEmail");
            const passwordInput = document.getElementById("adminPassword");

            emailInput.value = "";
            passwordInput.value = "";

            emailInput.addEventListener("focus", () => {
                emailInput.setAttribute("readonly", "readonly");
                setTimeout(() => emailInput.removeAttribute("readonly"), 100);
            });

            passwordInput.addEventListener("focus", () => {
                passwordInput.setAttribute("readonly", "readonly");
                setTimeout(() => passwordInput.removeAttribute("readonly"), 100);
            });

            checkLockStatus();
        };

        function checkLockStatus() {
            let lockUntil = localStorage.getItem("adminLockUntil");
            let loginBtn = document.getElementById("loginBtn");
            let lockMsg = document.getElementById("lockMsg");

            if (lockUntil && Date.now() < lockUntil) {
                let remaining = Math.ceil((lockUntil - Date.now()) / 1000);

                loginBtn.disabled = true;

                lockMsg.style.display = "block";
                lockMsg.innerText = `Too many attempts. Try again in ${remaining} seconds`;

                let interval = setInterval(() => {
                    let time = Math.ceil((lockUntil - Date.now()) / 1000);
                    if (time > 0) {
                        lockMsg.innerText = `Too many attempts. Try again in ${time} seconds`;
                    } else {
                        clearInterval(interval);
                        unlockAdmin();
                    }
                }, 1000);
            } else {
                unlockAdmin();
            }
        }

        function unlockAdmin() {
            localStorage.removeItem("adminLockUntil");
            localStorage.setItem("adminAttempts", 0);

            document.getElementById("loginBtn").disabled = false;
            document.getElementById("lockMsg").style.display = "none";
        }

        function adminLogin(email, password) {
            const found = defaultAdmins.find(a => a.email === email && a.password === password);
            if (found) {
                localStorage.setItem("adminLoggedIn", "true");
                localStorage.setItem("adminLoggedInAs", email);
                localStorage.setItem("adminAttempts", 0);
                window.location.href = "adminpanel.html";
                return true;
            }
            return false;
        }

        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("adminEmail").value.trim();
            const password = document.getElementById("adminPassword").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            if (!email || !password) {
                errorMsg.style.display = "block";
                errorMsg.textContent = "Please enter both email and password.";
                return;
            }

            let attempts = Number(localStorage.getItem("adminAttempts")) || 0;

            if (adminLogin(email, password)) {
                errorMsg.style.display = "none";
                return;
            } else {
                attempts++;
                localStorage.setItem("adminAttempts", attempts);
                errorMsg.style.display = "block";
                errorMsg.textContent = "Wrong email or password!";

                if (attempts >= 3) {
                    let lockUntil = Date.now() + LOCK_TIME;
                    localStorage.setItem("adminLockUntil", lockUntil);
                    checkLockStatus();
                }
            }
        });
    </script>
</body>

</html>
